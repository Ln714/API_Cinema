spring.application.name=Filmes


#server tomcat
server.port=8080

#config DATABASE
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#Spring JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#swagger

spring.api-docs.path=/v3/api-docs
spring.doc.swagger-ui.path=/swagger-ui.html

#JWT
jwt.secret=${JWT_SECRET:cinema-reservas-jwt-chave-secreta-muito-segura-256-bits-ou-mais-longa-aqui}
jwt.expiration=${JWT_EXPIRATION}